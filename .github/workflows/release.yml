name: Validate and publish skills
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s scripts
      - run: python scripts/package.py --output dist
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: skills-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/package.py --output dist
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
      # Installed Claude Code plugins update when their version changes, so
      # the release sets it: the tag without its "v", committed to main.
      - name: Set the plugin version on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main FETCH_HEAD
          python - <<'PY'
          import json, os
          path = ".claude-plugin/marketplace.json"
          data = json.load(open(path))
          for plugin in data["plugins"]:
              plugin["version"] = os.environ["RELEASE_TAG"].removeprefix("v")
          open(path, "w").write(json.dumps(data, indent=2) + "\n")
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: plugin version ${RELEASE_TAG#v}"
          git push origin main
